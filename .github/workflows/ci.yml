name: CI

on:
    push:
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
            
            - name: Install dependencies
              run: bun ci
            
            - name: Lint
              run: bun run lint
            
            - name: Typecheck
              run: bun run typecheck

            - name: Build
              run: bun run build